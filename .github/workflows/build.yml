name: APK 빌드

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 빌드
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-remote.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: tv-remote.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV 리모컨 v${{ github.run_number }}
          files: tv-remote.apk
