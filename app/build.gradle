plugins {
    id 'com.android.application'
}

android {
    namespace 'com.family.tvremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.family.tvremote'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 항상 같은 키로 서명해서, 새 버전을 지우지 않고 덮어 설치할 수 있게 함
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
